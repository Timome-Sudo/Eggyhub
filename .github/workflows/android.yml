name: Android CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_HOME: ~/android-sdk
  APK_DIR: app/build/outputs/apk/release
  ORIG_APK: app-release-unsigned.apk
  RENAME_APK: app-prerelease-unsigned.apk
  SIGNED_APK: app-prerelease-signed.apk
  KEYSTORE_FILE: ./prekey
  KEYSTORE_PWD: 114514
  KEY_ALIAS: key0
  KEY_PWD: 114514
  BUILD_TOOLS_VERSION: 35.0.0
  TZ: Asia/Shanghai

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: true

      - name: 获取北京时间并生成发布信息
        run: |
          NOW=$(date +'%Y.%m.%d.%H时%M分%S秒')
          TAG_TIME=$(date +'%Y%m%d-%H%M%S')
          TIME_ZONE_LABEL="北京时间 UTC+8"

          echo "TAG_NAME=prerelease-${TAG_TIME}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=beta($NOW ${TIME_ZONE_LABEL})" >> $GITHUB_ENV
          echo 'RELEASE_BODY=⚠️免责声明⚠️1. 🧪本Beta安装包为CI自动编译生成，附带项目内置密钥签名测试版本；2. 📱安装、运行本程序所造成的设备卡顿、数据丢失、系统异常等一切问题，开发者不承担任何赔偿与修复责任；3. 💡若使用中出现故障、闪退、功能异常，可反馈Issues，但不承诺提供修复、技术支援。下载即代表你已完整阅读并同意以上全部条款！' >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          show-progress: true

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: ~/android-sdk
          key: ${{ runner.os }}-android-sdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          show-progress: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        id: gradle_build
        continue-on-error: true
        run: |
          ./gradlew clean assembleRelease --no-daemon --info 2>&1 > build_log.txt
          echo EXIT_CODE=$? >> $GITHUB_ENV

      - name: 上传完整编译日志
        uses: actions/upload-artifact@v5
        with:
          name: full-build-log
          path: build_log.txt
          retention-days: 14

      - name: 打印全部编译日志，输出完整报错
        run: |
          echo "===================== 完整编译日志开始 ====================="
          cat build_log.txt
          echo "===================== 完整编译日志结束 ====================="

      - name: 全局检索所有APK用于调试
        run: |
          echo "===== 项目内全部APK ====="
          find . -name "*.apk"
          echo "===== Release目录文件 ====="
          ls -la ${{ env.APK_DIR }} 2>/dev/null || echo "release目录不存在"

      - name: 校验原生未签名APK与密钥文件存在
        if: env.EXIT_CODE == '0'
        run: |
          SRC=${{ env.APK_DIR }}/${{ env.ORIG_APK }}
          if [ ! -f "$SRC" ]; then
            echo "错误：未找到原生包 $SRC"
            ls ${{ env.APK_DIR }}/*.apk 2>/dev/null
            exit 1
          fi
          if [ ! -f ${{ env.KEYSTORE_FILE }} ]; then
            echo "错误：仓库根目录缺少签名文件 prekey"
            exit 1
          fi

      - name: 重命名APK为prerelease未签名包
        if: env.EXIT_CODE == '0'
        run: |
          SRC=${{ env.APK_DIR }}/${{ env.ORIG_APK }}
          DST=${{ env.APK_DIR }}/${{ env.RENAME_APK }}
          mv "$SRC" "$DST"
          echo "重命名完成：$SRC → $DST"

      - name: APK对齐 + jarsigner签名（兼容修复方案）
        if: env.EXIT_CODE == '0'
        run: |
          BUILD_TOOLS=${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          ZIPALIGN=$BUILD_TOOLS/zipalign
          UNSIGNED=${{ env.APK_DIR }}/${{ env.RENAME_APK }}
          ALIGN_TMP=${{ env.APK_DIR }}/align-tmp.apk
          SIGNED_OUTPUT=${{ env.APK_DIR }}/${{ env.SIGNED_APK }}

          # 4字节对齐
          $ZIPALIGN -f 4 "$UNSIGNED" "$ALIGN_TMP"
          
          # jarsigner签名
          jarsigner \
            -keystore ${{ env.KEYSTORE_FILE }} \
            -storepass ${{ env.KEYSTORE_PWD }} \
            -keypass ${{ env.KEY_PWD }} \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$ALIGN_TMP" \
            ${{ env.KEY_ALIAS }}

          # 输出最终签名包
          mv "$ALIGN_TMP" "$SIGNED_OUTPUT"
          echo "✅ 签名完成，成品：$SIGNED_OUTPUT"
          ls -la ${{ env.APK_DIR }}

      - name: Upload 未签名备份APK
        if: env.EXIT_CODE == '0'
        uses: actions/upload-artifact@v5
        with:
          name: release-preview-unsigned-apk
          path: ${{ env.APK_DIR }}/${{ env.RENAME_APK }}
          retention-days: 14

      - name: Upload 已签名成品APK
        if: env.EXIT_CODE == '0'
        uses: actions/upload-artifact@v5
        with:
          name: release-preview-signed-apk
          path: ${{ env.APK_DIR }}/${{ env.SIGNED_APK }}
          retention-days: 14

      - name: Publish Prerelease 上传签名包到Release
        if: env.EXIT_CODE == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            ${{ env.APK_DIR }}/${{ env.SIGNED_APK }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
